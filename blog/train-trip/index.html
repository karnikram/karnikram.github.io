	<script>
		const themeToggle = document.getElementById('theme-toggle'); const iconSun = themeToggle.querySelector('.icon-sun'); const iconMoon = themeToggle.querySelector('.icon-moon');
		function applyThemeIcons(theme) { if (theme === 'dark') { iconSun.style.display = 'block'; iconMoon.style.display = 'none'; } else { iconSun.style.display = 'none'; iconMoon.style.display = 'block'; } }
		applyThemeIcons(document.documentElement.getAttribute('data-theme') || 'light');
		themeToggle.addEventListener('click', () => { const current = document.documentElement.getAttribute('data-theme'); const next = current === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', next); localStorage.setItem('theme', next); applyThemeIcons(next); });
		window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => { if (!localStorage.getItem('theme')) { const theme = e.matches ? 'dark' : 'light'; document.documentElement.setAttribute('data-theme', theme); applyThemeIcons(theme); } });
		const menuBtn = document.getElementById('menu-btn'); const navMenu = document.getElementById('nav-menu'); const menuIcon = menuBtn.querySelector('.menu-icon'); const closeIcon = menuBtn.querySelector('.close-icon');
		menuBtn.addEventListener('click', () => { const isOpen = menuBtn.getAttribute('aria-expanded') === 'true'; menuBtn.setAttribute('aria-expanded', isOpen ? 'false' : 'true'); menuBtn.setAttribute('aria-label', isOpen ? 'Open Menu' : 'Close Menu'); navMenu.classList.toggle('open'); menuIcon.style.display = isOpen ? 'block' : 'none'; closeIcon.style.display = isOpen ? 'none' : 'block'; });
	</script>
